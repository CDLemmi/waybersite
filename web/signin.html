        </div>

            <h2>Anmelden</h2>

                <input type="checkbox" id="cbSaveLogin" style="margin-left: -150px;"></input>
                <label for="cbSaveLogin">Login für 7 Tage speichern</label>
            </div>
            <button id="btnLogin" style="margin-top: 0px;">Login</button>            
        </div>
